[project]
name = "air-quality-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.6"
dependencies = [
    "ipykernel>=7.2.0",
    "langchain>=1.2.17",
    "langchain-anthropic>=1.4.3",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.1.10",
    "langsmith>=0.8.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "openmeteo-requests>=1.7.5",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "python-dotenv>=1.2.2",
    "requests-cache>=1.3.1",
    "retry-requests>=2.0.0",
    "streamlit>=1.57.0",
]

[dependency-groups]
dev = [
    "grandalf>=0.8",
    "nbconvert>=7.17.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"eval/evaluator.py" = ["E402"]
"main.py" = ["E402"]
"src/agent.py" = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
